name: Publish APT repository
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Build, lint, and test Debian packages
    uses: ./.github/workflows/pr-check.yml

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    concurrency:
      group: publish-chonkos-apt
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: checked-packages
          path: build
      - name: Validate release version and collect Conventional Commits
        run: |
          version=$(jq -er '.version' build/metrics.json)
          tag="v$version"
          if [[ $GITHUB_REF_TYPE == tag ]]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -1 "$tag")" = "$GITHUB_SHA"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          range=$GITHUB_SHA
          previous=$(git describe --tags --match 'v*.*.*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          if [[ -n $previous ]]; then range="$previous..$GITHUB_SHA"; fi
          git log --reverse --format='%s (%h)' "$range" |
            awk '/^[a-z][a-z0-9-]*(\([^)]*\))?!?: / { print "- " $0; n++ }
                 END { if (!n) print "No Conventional Commits in this release." }' > "$RUNNER_TEMP/changes.md"
      - name: Restore published archive
        run: |
          ref=$(git ls-remote --heads origin refs/heads/gh-pages)
          if [[ -n $ref ]]; then
            git fetch origin refs/heads/gh-pages
            git worktree add --detach pages FETCH_HEAD
          else
            git worktree add --detach pages HEAD
            git -C pages switch --orphan gh-pages
          fi
      - name: Generate and sign APT repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg
          bash .github/scripts/build-archive.sh
      - name: Publish gh-pages
        working-directory: pages
        run: |
          git config user.name 'Oliwier-w'
          git config user.email 'oliwier.wygonnypl@gmail.com'
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Publish $RELEASE_TAG"; fi
          git push origin HEAD:refs/heads/gh-pages
      - name: Request Pages build from the published branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
