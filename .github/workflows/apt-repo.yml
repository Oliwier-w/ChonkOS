name: Build APT repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg musl-tools

      - name: Install Rust musl target
        run: rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools

      - name: Build Rust tools (musl)
        run: |
          cargo test --manifest-path tools/Cargo.toml
          cargo clippy --manifest-path tools/Cargo.toml --all-targets -- -D warnings
          cargo build --release --manifest-path tools/Cargo.toml --target x86_64-unknown-linux-musl

      - name: Build packages
        run: |
          mkdir -p repo/pool/main repo/dists/trixie/main/binary-amd64
          mkdir -p packages/chonkos-tools/usr/bin \
                   packages/chonkos-tools/usr/share/doc/chonkos \
                   packages/chonkos-tools/usr/share/man/man1

          for bin in chonk scale nap whisker seal; do
            cp "tools/target/x86_64-unknown-linux-musl/release/$bin" packages/chonkos-tools/usr/bin/
          done
          chmod 0755 packages/chonkos-tools/usr/bin/*

          cp docs/TOOLS.md packages/chonkos-tools/usr/share/doc/chonkos/TOOLS.md
          cp docs/man/*.1 packages/chonkos-tools/usr/share/man/man1/

          chmod 0755 packages/chonkos-branding/DEBIAN packages/chonkos-core/DEBIAN packages/chonkos-tools/DEBIAN
          chmod 0755 packages/chonkos-branding/DEBIAN/preinst packages/chonkos-branding/DEBIAN/postrm

          dpkg-deb --root-owner-group --build packages/chonkos-branding repo/pool/main/chonkos-branding_0.3.0_all.deb
          dpkg-deb --root-owner-group --build packages/chonkos-tools repo/pool/main/chonkos-tools_0.3.0_amd64.deb
          dpkg-deb --root-owner-group --build packages/chonkos-core repo/pool/main/chonkos-core_0.3.0_all.deb

      - name: Sign and generate repo index
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')

          (cd repo && dpkg-scanpackages --multiversion pool/main > dists/trixie/main/binary-amd64/Packages)
          gzip -k -f repo/dists/trixie/main/binary-amd64/Packages

          (cd repo/dists/trixie && apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="ChonkOS" \
            -o APT::FTPArchive::Release::Label="ChonkOS" \
            -o APT::FTPArchive::Release::Suite="trixie" \
            -o APT::FTPArchive::Release::Codename="trixie" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            release . > Release)

          gpg --batch --yes --pinentry-mode loopback --passphrase '' --default-key "$KEY_ID" \
            --digest-algo SHA256 -abs -o repo/dists/trixie/Release.gpg repo/dists/trixie/Release
          gpg --batch --yes --pinentry-mode loopback --passphrase '' --default-key "$KEY_ID" \
            --digest-algo SHA256 --clearsign -o repo/dists/trixie/InRelease repo/dists/trixie/Release

          cp chonkos-archive-keyring.asc repo/chonkos-archive-keyring.asc

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          force_orphan: true
