# ChonkOS dunst drop-in (flat Arctic style, 1px borders).
# Debian's dunst reads drop-ins from /etc/xdg/dunst/dunstrc.d/.

[global]
    font = JetBrains Mono 10
    frame_width = 1
    frame_color = "#263646"
    background = "#16202A"
    foreground = "#E6EEF5"
    width = 360
    height = 120
    offset = 16x16
    origin = top-right
    padding = 10
    gap_size = 4

[urgency_low]
    background = "#16202A"
    foreground = "#8CA0B3"
    frame_color = "#263646"

[urgency_normal]
    background = "#16202A"
    foreground = "#E6EEF5"
    frame_color = "#263646"

[urgency_critical]
    background = "#EF4444"
    foreground = "#0E141B"
    frame_color = "#EF4444"
