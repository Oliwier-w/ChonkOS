set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 10
set -g status-style 'bg=colour24,fg=colour250'
set -g status-left ' #S '
set -g status-right '%H:%M '
if-shell "[ -r \"$HOME/.config/chonkos/generated/tmux-theme.conf\" ]" "source-file \"$HOME/.config/chonkos/generated/tmux-theme.conf\""
if-shell "[ -r \"$HOME/.config/chonkos/overrides/tmux/tmux.conf\" ]" "source-file \"$HOME/.config/chonkos/overrides/tmux/tmux.conf\""
