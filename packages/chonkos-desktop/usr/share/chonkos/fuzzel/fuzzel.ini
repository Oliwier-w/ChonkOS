# ChonkOS Fuzzel base configuration (flat Arctic palette).
# The generated theme and user override layers are appended as include=
# lines by /usr/libexec/chonkos/fuzzel-launch.

[main]
font=JetBrains Mono:size=11
prompt="> "
lines=10
width=32
layer=top

[colors]
background=0e141bff
text=e6eef5ff
match=38bdf8ff
selection=16202aff
selection-text=e6eef5ff
selection-match=38bdf8ff
border=263646ff

[border]
width=1
radius=0
