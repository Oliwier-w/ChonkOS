### ChonkOS outputs and session daemons (segment 30).

# Flat Arctic background: one solid color, no gradients.
exec /usr/bin/swaybg --color #0E141B --mode solid_color

exec /usr/libexec/chonkos/mako-launch
exec /usr/bin/kanshi

# Lock the screen and power the outputs off when idle.
exec /usr/bin/swayidle -w \
    timeout 300 'swaylock -f -c 0E141B' \
    timeout 600 'swaymsg "output * dpms off"' \
    resume 'swaymsg "output * dpms on"' \
    before-sleep 'swaylock -f -c 0E141B'
