### ChonkOS theme (segment 50): flat Arctic tiling.
# Window decorations are reduced to a crisp 1px pixel border. Colors and the
# font come from the palette include injected by the session wrapper ahead
# of all segments (generated/sway-colors.conf or default-colors.conf).

default_border pixel 1
default_floating_border pixel 1
gaps inner 4
smart_borders on
smart_gaps on
