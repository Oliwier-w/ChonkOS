### ChonkOS Sway variables (segment 10).
# The color palette include is injected by /usr/libexec/chonkos/sway-session
# ahead of all segments: generated/sway-colors.conf wins and
# /usr/share/chonkos/sway/default-colors.conf is the fallback.

set $mod Mod4
set $terminal /usr/libexec/chonkos/foot-launch
set $launcher /usr/libexec/chonkos/fuzzel-launch

# Focus keys shared by the key binding segment.
set $left h
set $down j
set $up k
set $right l
