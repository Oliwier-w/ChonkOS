### ChonkOS key bindings (segment 40).

# Applications.
bindsym --to-code $mod+Return exec $terminal
bindsym --to-code $mod+d exec $launcher
bindsym $mod+Shift+q kill

# Screenshot the interactive selection straight to the clipboard.
bindsym --to-code Print exec sh -c 'grim -g "$(slurp)" - | wl-copy'

# Focus and movement.
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# Layout.
bindsym $mod+b splith
bindsym $mod+v splitv
bindsym $mod+e layout toggle split
bindsym $mod+f fullscreen
bindsym $mod+space floating toggle
bindsym $mod+a focus parent

# Session control.
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit this ChonkOS session?' -b 'Exit' 'swaymsg exit'

# Volume (PipeWire via wpctl).
bindsym --to-code XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --to-code XF86AudioLowerVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bindsym --to-code XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness.
bindsym --to-code XF86MonBrightnessUp exec brightnessctl set +5%
bindsym --to-code XF86MonBrightnessDown exec brightnessctl set 5%-

# Resize mode.
mode "resize" {
    bindsym $left resize shrink width 10 px
    bindsym $down resize grow height 10 px
    bindsym $up resize shrink height 10 px
    bindsym $right resize grow width 10 px
    bindsym Left resize shrink width 10 px
    bindsym Down resize grow height 10 px
    bindsym Up resize shrink height 10 px
    bindsym Right resize grow width 10 px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"
