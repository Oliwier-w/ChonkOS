[workspace]
members = ["crates/chonk-lib", "crates/chonk", "crates/scale", "crates/nap", "crates/whisker", "crates/seal", "xtask"]
resolver = "2"

[workspace.package]
version = "0.4.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
